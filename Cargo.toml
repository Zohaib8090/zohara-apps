[workspace]
resolver = "2"
members = [
    "common",
    "welcome",
    "update",
    "usermgr",
    "migrate",
]

# Shared workspace dependencies. Crates add these with `dep.workspace = true`.
[workspace.dependencies]
# GTK4 + libadwaita — same toolkit zohara-settings uses
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
glib = "0.20"
# D-Bus (NetworkManager, BlueZ, UPower)
zbus = { version = "5", features = ["tokio"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Process spawning (pacman, etc.)
# (use std::process + smol; the explicit tokio dep is for D-Bus only)
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# CLI parsing
clap = { version = "4", features = ["derive"] }
# Shared internal types
zohara-common = { path = "common" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR GPL-3.0-or-later"
authors = ["Zohara OS Team <https://github.com/Zohaib8090/zohara>"]
repository = "https://github.com/Zohaib8090/zohara-apps"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = true
strip = true
