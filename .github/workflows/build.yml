name: Build & Publish Zohara Apps

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [stable, beta, alpha]

env:
  CARGO_TERM_COLOR: always
  PACKAGES_REPO: Zohaib8090/zohara-packages

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: write
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git rust gtk4 libadwaita dbus pkgconf sudo
          useradd -m -G wheel builder || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /home/builder/.cargo /home/builder/target
          chown -R builder:builder /home/builder
          # The actions/checkout step runs as root and creates files
          # owned by root. Cargo needs to be able to write Cargo.lock
          # and a target/ subdir, so chown the workspace BEFORE any
          # cargo step runs.
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Code
        run: sudo -u builder env CARGO_TARGET_DIR=/home/builder/target cargo check --release

      - name: Build Release Binaries
        run: sudo -u builder env CARGO_TARGET_DIR=/home/builder/target cargo build --release

      - name: List built binaries
        run: ls -lh /home/builder/target/release/zohara-*

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CH="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CH="stable"
          elif [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            CH="beta"
          else
            echo "::error::Unknown ref ${{ github.ref }}"
            exit 1
          fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then
            echo "::error::Could not read version from Cargo.toml"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Package all four binaries with makepkg
        run: |
          # PKGBUILD is a single split package (pkgbase=zohara-apps,
          # pkgname=(zohara-welcome zohara-update zohara-usermgr
          # zohara-migrate)) so one makepkg call produces all four real
          # pacman packages from the binaries "Build Release Binaries" just
          # built. Before this, CI uploaded the raw ELF binaries as release
          # assets -- never a .pkg.tar.zst -- so `pacman -S zohara-welcome`
          # had nothing installable to find, and
          # zohara-packages/publish.yml's `find -name '*.pkg.tar.zst'`
          # never matched anything either.
          chown -R builder:builder .
          rm -rf target
          ln -s /home/builder/target target
          chown -h builder:builder target
          sudo -u builder env _PKGVER="${{ steps.version.outputs.version }}" \
            makepkg --nodeps --nocheck --noconfirm
          mkdir -p /tmp/built
          cp -v ./*.pkg.tar.zst /tmp/built/
          ls -lh /tmp/built/

      - name: Upload each package as its own build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zohara-apps-x86_64
          path: /tmp/built/*.pkg.tar.zst

      - name: Get or create channel release in zohara-packages
        env:
          # GITHUB_TOKEN is scoped to THIS repo (zohara-apps) only -- it
          # cannot create a release or upload an asset in zohara-packages.
          # Every cross-repo step below needs PACKAGES_DISPATCH_TOKEN, the
          # same PAT zohara-settings' build.yml already uses for this.
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PACKAGES_DISPATCH_TOKEN not set; packages stay in this run's build artifact only."
            echo "skip=1" >> "$GITHUB_ENV"
            exit 0
          fi
          pacman -S --noconfirm --needed github-cli
          if [ "$CHANNEL" = "stable" ]; then
            TAG="stable"
          else
            TAG="channel-$CHANNEL"
          fi
          REL_ID=$(gh release view "$TAG" --repo "$PACKAGES_REPO" --json id -q '.id' 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            PRE=$([ "$CHANNEL" != "stable" ] && echo "--prerelease" || echo "")
            gh release create "$TAG" \
              --repo "$PACKAGES_REPO" \
              --title "Zohara Packages — $CHANNEL" \
              --notes "Auto-managed Arch package repository for the **$CHANNEL** channel. Updated by the zohara-apps CI." \
              $PRE
          fi
          echo "release_tag=$TAG" >> "$GITHUB_ENV"

      - name: Upload all built packages to the channel release
        if: env.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          TAG: ${{ env.release_tag }}
        run: |
          for pkg in /tmp/built/*.pkg.tar.zst; do
            echo "Uploading $(basename "$pkg")..."
            gh release upload "$TAG" "$pkg" \
              --repo "$PACKAGES_REPO" \
              --clobber
          done

      - name: Dispatch to zohara-packages publish workflow
        if: env.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          # One dispatch per package, all pointing at this same run's
          # artifact (zohara-apps-x86_64, which holds all four .pkg.tar.zst
          # files) -- artifact_name tells publish.yml which file inside it
          # to pick, since a blind "first .pkg.tar.zst in the artifact"
          # would grab the same one regardless of which package_name was
          # actually being dispatched.
          # Match by known pkgname prefix rather than parsing the filename
          # apart (an Arch filename is <pkgname>-<pkgver>-<pkgrel>-<arch>...
          # and pkgver/pkgrel can themselves contain dashes, which makes
          # splitting on "-" ambiguous in general).
          for pkgname in zohara-welcome zohara-update zohara-usermgr zohara-migrate; do
            pkg="/tmp/built/${pkgname}-${VER}-1-x86_64.pkg.tar.zst"
            [ -f "$pkg" ] || { echo "::warning::expected $pkg, skipping"; continue; }
            name=$(basename "$pkg")
            echo "Dispatching $pkgname $VER channel=$CHANNEL"
            curl -fsSL -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PACKAGES_REPO/dispatches" \
              -d "{
                \"event_type\": \"package-published\",
                \"client_payload\": {
                  \"package_name\": \"$pkgname\",
                  \"version\": \"$VER\",
                  \"run_id\": \"${{ github.run_id }}\",
                  \"source_repo\": \"Zohaib8090/zohara-apps\",
                  \"artifact_name\": \"zohara-apps-x86_64\",
                  \"pkg_filename\": \"$name\",
                  \"channel\": \"$CHANNEL\"
                }
              }"
          done
